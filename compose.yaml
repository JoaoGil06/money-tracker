services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: money_tracker
      POSTGRES_USER: money_tracker
      POSTGRES_PASSWORD: money_tracker   # dev only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U money_tracker -d money_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data: